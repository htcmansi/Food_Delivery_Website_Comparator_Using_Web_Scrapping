
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"> 
</head>
<body>
    <div class="background-container"></div>
    <div class="container">
        <h1 class="logo">Eat Genius</h1> 
        <div class="tabs">
            <div class="tab" onclick="showLogin()">Login</div>
            <div class="tab" onclick="showRegister()">Register</div>
        </div>

        <div id="loginForm" class="form">
            <form action="{{ url_for('login') }}" method="POST">
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="email" placeholder="Email" id="loginemail" name="email">
                </div>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" id="loginPassword" name="password">
                </div>
                <div class="forgot-password-container">
                    <input type="checkbox" id="forgotPasswordCheckbox">
                    <label for="forgotPasswordCheckbox">Forgot Password?</label>
                </div>
                <button type="submit" class="login-register-button">Login</button>
            </form>
            <p class="message" id="loginMessage"></p>
        </div>

        <div id="registerForm" class="form" style="display: none;">
            <form action="{{ url_for('register') }}" method="POST">
                <div class="input-container">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Username" id="registerUsername" name="username">
                </div>
                <div class="input-container">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Email" id="registerEmail" name="email">
                </div>
                <div class="input-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="Password" id="registerPassword" name="password">
                </div>
                <button type="submit" class="login-register-button">Register</button>
            </form>
            <p class="message" id="registerMessage"></p>
        </div>
    </div>

    <script>
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        showLogin();
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
