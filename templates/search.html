<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/search.css') }}" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Search Your Food </title>
    
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="Images/logo1.png" alt="Eat Genius Logo" class="logo-img">
                    Eat Genius
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link home-link" href="/home">Home</a>
                        </li> 
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                Restaurants
                            </a>
                            <div class="dropdown-menu" aria-labelledby="navbarDropdown" id="restaurantDropdown">
                                <a class="dropdown-item" href="#" value="swiggy" data-source="swiggy">Swiggy</a>
                                <a class="dropdown-item" href="#" value = "zomato" data-source="zomato">Zomato</a>
                            </div>
                        </li>
                        <li class="nav-item compare-item">
                            <a class="nav-link" href="#">Compare</a>
                        </li>
                        <!-- Add other navbar items here -->
                    </ul>
                    <div class="cart-login-container">
                        <ul class="navbar-nav">
                            <!--<li class="nav-item">
                                <a href="login_page.html" class="nav-link signup-btn" id="signupBtn">Login/Register</a>
                            </li>-->
                            <li class="nav-item">
                                <div class="cart">
                                    <span class="icon-space"></span>
                                    <i class="bi bi-cart-fill cart-icon"></i>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
        <div class="compare-text">
            Compare the Restaurants from <br>Swiggy or Zomato
        </div>
        
        <div class="city-selection">
            <div class="city-box">
                <form action="/search_page.html"  method="post">
                    <!-- <div class="city-title">Select Your City</div> -->
                    <div class="autocomplete">
                        
                        <label for="city" class="cuisine-title">Enter City</label>
                        <input type="text" name="city" id="cityInput" class="city-input" placeholder="Enter city">
                        <div id="cityList" class="autocomplete-items"></div>
                    </div>
                    <div class="cuisine-selection">
                        <div class="cuisine-title">Select Cuisine</div>
                        
                        <input type="text" name="food" id="food" class="cuisine-input" placeholder="Enter cuisine">
                        
                    </div>
                    <div class="food-type-selection">
                        <div class="food-type-title">Select Food Type</div>
                        <select name="site" class="food-type-dropdown">
                            <option value="swiggy">Swiggy</option>
                            <option value="zomato">Zomato</option>
                            
                        </select>
                    </div>
                    <button class="find-now-btn" type="submit">Find Now</button>
                </form>
            </div>
        </div>
    </header>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <!-- <script src="{{ url_for('static', filename='js/search.js') }}"></script> -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <!-- Place this before the closing </body> tag -->

    <script>
        $(document).ready(function(){
            const swiggyRestaurants = [
                "Pizza Hut",
                "Burger King",
                "Burger Mines",
                "Best Belgian Waffle",
                "Subway"
            ];

            const zomatoRestaurants = [
                "Natural Ice Cream",
                "Classic Kitchen",
                "Amul Dairy & Ice cream Parlor",
                "Suchali's Artisan Bakehouse",
                "Good Flippin' Burgers"
            ];

            // Function to show restaurant dropdown
            function showRestaurantDropdown(source) {
                const dropdownMenu = $("#restaurantDropdown");
                dropdownMenu.empty(); // Clear existing dropdown items

                const restaurants = source === "swiggy" ? swiggyRestaurants : zomatoRestaurants;

                // Add new dropdown items for restaurants
                restaurants.forEach(function(restaurant) {
                    const dropdownItem = `<a class="dropdown-item" href="#">${restaurant}</a>`;
                    dropdownMenu.append(dropdownItem);
                });

                // Handle click event for restaurant dropdown items
                $(".dropdown-item").click(function(event) {
                    event.preventDefault(); // Prevent default link behavior
                    const restaurantName = $(this).text();
                    alert(`You selected: ${restaurantName}`);
                    dropdownMenu.empty(); // Clear the dropdown menu after selection
                    dropdownMenu.append(`<a class="dropdown-item" href="#" data-source="swiggy">Swiggy</a>`);
                    dropdownMenu.append(`<a class="dropdown-item" href="#" data-source="zomato">Zomato</a>`);
                });
            }

            // Handle click event for restaurant dropdown items
            $(".dropdown-item").click(function(event) {
                event.preventDefault(); // Prevent default link behavior
                const source = $(this).data("source");
                showRestaurantDropdown(source);
            });
        });
    </script>







</body>
</html>
